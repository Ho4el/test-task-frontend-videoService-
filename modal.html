<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="css/modal_style.css">
	<link rel="stylesheet" href="css/style.css">
	<title>modal</title>
</head>
<body>
	<div class="modal__backgraund">

		<div class="modal__container">
			<p class="modal__login-p">Вход</p>
			<form class="modal__form" action="index.html">
				<input class="modal__login-input" type="text" placeholder="Логин">
				<input class="modal__login-input" type="password" placeholder="Пароль">

				<div class="modal__login-checkbox">
					<div>
						<input type="checkbox" id="check1">
						<div class="checkmark"><p>&#10004</p></div>
					</div>
					<div>
						<label for="check1">Запомнить</label>
					</div>
				</div>
				
				<input class="modal__login-button" type="submit" value="Войти">
			</form>
		</div>

	</div>
</body>
</html>
